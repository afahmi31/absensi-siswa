<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>Semester — konfirmasi penutupan</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F4F7F6"/><rect x="0" y="0" width="1440" height="72" rx="0" fill="#FFFFFF"/><rect x="48" y="18" width="36" height="36" rx="10" fill="#126451"/><rect x="55.92" y="26.64" width="7.92" height="17.28" rx="2" fill="#FFFFFF"/><rect x="67.08" y="26.64" width="7.92" height="17.28" rx="2" fill="#FFFFFF"/><text x="96" y="43" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172D29" text-anchor="start">Absensi Siswa</text><text x="590" y="43" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526760" text-anchor="start">Siswa</text><text x="715" y="43" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526760" text-anchor="start">Impor Excel</text><text x="855" y="43" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526760" text-anchor="start">Kalender</text><rect x="977" y="18" width="88" height="38" rx="9" fill="#E8F3ED"/><text x="985" y="43" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#126451" text-anchor="start">Semester</text><text x="1120" y="43" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526760" text-anchor="start">Laporan</text><rect x="1324" y="18" width="38" height="38" rx="19" fill="#E8F3ED"/><text x="1343" y="43" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#126451" text-anchor="middle">G</text><line x1="0" y1="71" x2="1440" y2="71" stroke="#D9E3DF" stroke-width="1"/><text x="64" y="132" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172D29" text-anchor="start">Semester</text><text x="64" y="164" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526760" text-anchor="start">Kelas 5A · Tahun ajaran 2026/2027</text><rect x="64" y="190" width="1312" height="126" rx="14" fill="#FFFFFF" stroke="#D9E3DF"/><text x="96" y="232" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172D29" text-anchor="start">Ganjil 2026/2027</text><rect x="290" y="207" width="158" height="28" rx="14" fill="#E8F3ED"/><text x="369" y="226" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#126451" text-anchor="middle">Aktif · belum ditutup</text><text x="96" y="264" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526760" text-anchor="start">13 Juli — 15 Desember 2026</text><text x="96" y="290" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#805C11" text-anchor="start">4 hari sekolah belum lengkap</text><rect x="1128" y="226" width="216" height="46" rx="10" fill="#FFFFFF" stroke="#D9E3DF"/><text x="1236" y="255" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#126451" text-anchor="middle">Tutup semester</text><rect x="64" y="338" width="1312" height="82" rx="12" fill="#FFFFFF" stroke="#D9E3DF"/><text x="96" y="371" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172D29" text-anchor="start">Genap 2025/2026</text><rect x="304" y="350" width="212" height="28" rx="14" fill="#EDF2EF"/><text x="410" y="369" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#526760" text-anchor="middle">Ditutup · hanya lihat dan cetak</text><text x="96" y="397" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">5 siswa masih terdaftar pada akhir semester</text><text x="1100" y="388" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#126451" text-anchor="start">Buat semester baru</text><rect x="0" y="0" width="1440" height="900" fill="#172D29" fill-opacity="0.42"/><rect x="0" y="0" width="1440" height="72" rx="0" fill="#FFFFFF"/><rect x="48" y="18" width="36" height="36" rx="10" fill="#126451"/><rect x="55.92" y="26.64" width="7.92" height="17.28" rx="2" fill="#FFFFFF"/><rect x="67.08" y="26.64" width="7.92" height="17.28" rx="2" fill="#FFFFFF"/><text x="96" y="43" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172D29" text-anchor="start">Absensi Siswa</text><rect x="400" y="220" width="640" height="464" rx="18" fill="#FFFFFF" stroke="#D9E3DF"/><text x="444" y="270" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172D29" text-anchor="start">Tutup semester?</text><text x="444" y="308" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526760" text-anchor="start">Ganjil 2026/2027 · 13 Juli–15 Desember 2026</text><rect x="444" y="340" width="552" height="106" rx="10" fill="#FFF4D8" stroke="#E5D49D"/><text x="466" y="373" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#805C11" text-anchor="start">Masih ada 4 hari sekolah dengan absensi belum lengkap.</text><text x="466" y="400" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">Semester tetap dapat ditutup. Tanggal yang kosong tetap kosong,</text><text x="466" y="422" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">tidak dihitung sebagai Alpa.</text><text x="444" y="490" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172D29" text-anchor="start">Setelah ditutup, periode ini hanya bisa dilihat dan dicetak.</text><text x="444" y="518" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">Absensi tidak dapat dikoreksi dan semester tidak dapat dibuka kembali.</text><text x="444" y="572" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172D29" text-anchor="start">Apakah Anda tetap ingin menutup semester ini?</text><rect x="640" y="610" width="158" height="46" rx="10" fill="#FFFFFF" stroke="#D9E3DF"/><text x="719" y="639" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#126451" text-anchor="middle">Periksa lagi</text><rect x="812" y="610" width="184" height="46" rx="10" fill="#A63737"/><text x="904" y="639" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tutup semester</text></svg>
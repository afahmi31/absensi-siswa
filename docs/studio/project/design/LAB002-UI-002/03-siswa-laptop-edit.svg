, sans-serif" font-size="15" font-weight="400" fill="#172D29" text-anchor="start">13 Juli 2026</text><text x="500" y="468" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526760" text-anchor="start">Tanggal masuk dan keluar dihitung inklusif.</text><text x="96" y="490" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172D29" text-anchor="start">Tanggal keluar</text><rect x="96" y="500" width="373" height="46" rx="9" fill="#FFFFFF" stroke="#D9E3DF"/><text x="110" y="529" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#172D29" text-anchor="start">16 November 2026</text><text x="96" y="566" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526760" text-anchor="start">Kosongkan jika masih terdaftar.</text><rect x="96" y="598" width="805" height="82" rx="10" fill="#E8F3ED" stroke="#D9E3DF"/><text x="116" y="626" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#126451" text-anchor="start">Perubahan hanya berlaku pada semester aktif.</text><text x="116" y="651" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">Arsip semester lain tetap memakai identitas yang tercatat saat itu.</text><rect x="96" y="697" width="805" height="52" rx="9" fill="#EDF2EF"/><text x="114" y="729" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172D29" text-anchor="start">Siswa dengan absensi atau riwayat tidak dapat dihapus.</text><rect x="657" y="762" width="116" height="42" rx="10" fill="#FFFFFF" stroke="#D9E3DF"/><text x="715" y="789" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#126451" text-anchor="middle">Batal</text><rect x="785" y="762" width="116" height="42" rx="10" fill="#126451"/><text x="843" y="789" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Simpan</text><rect x="965" y="224" width="410" height="236" rx="16" fill="#FFFFFF" stroke="#D9E3DF"/><text x="997" y="267" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172D29" text-anchor="start">Masa terdaftar</text><rect x="997" y="288" width="146" height="28" rx="14" fill="#E8F3ED"/><text x="1070" y="307" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#126451" text-anchor="middle">Aktif semester ini</text><text x="997" y="350" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#172D29" text-anchor="start">13 Jul 2026 — 16 Nov 2026</text><text x="997" y="379" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">Catatan pada tanggal di luar masa ini</text><text x="997" y="399" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">tetap tersimpan dan tidak masuk hitungan.</text><rect x="965" y="482" width="410" height="124" rx="16" fill="#FFFFFF" stroke="#D9E3DF"/><text x="997" y="524" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172D29" text-anchor="start">Riwayat absensi ditemukan</text><text x="997" y="550" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">Tanggal keluar mengatur kewajiban hadir.</text><text x="997" y="572" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">Data lama tetap tersimpan.</text></svg>
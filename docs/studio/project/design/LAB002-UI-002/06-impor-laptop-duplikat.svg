<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img"><title>Impor Excel — pilihan nama sama</title><rect x="0" y="0" width="1440" height="860" rx="0" fill="#F4F7F6"/><rect x="0" y="0" width="1440" height="72" rx="0" fill="#FFFFFF"/><rect x="48" y="18" width="36" height="36" rx="10" fill="#126451"/><rect x="55.92" y="26.64" width="7.92" height="17.28" rx="2" fill="#FFFFFF"/><rect x="67.08" y="26.64" width="7.92" height="17.28" rx="2" fill="#FFFFFF"/><text x="96" y="43" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172D29" text-anchor="start">Absensi Siswa</text><text x="590" y="43" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526760" text-anchor="start">Siswa</text><rect x="707" y="18" width="112" height="38" rx="9" fill="#E8F3ED"/><text x="715" y="43" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#126451" text-anchor="start">Impor Excel</text><text x="855" y="43" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526760" text-anchor="start">Kalender</text><text x="985" y="43" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526760" text-anchor="start">Semester</text><text x="1120" y="43" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526760" text-anchor="start">Laporan</text><rect x="1324" y="18" width="38" height="38" rx="19" fill="#E8F3ED"/><text x="1343" y="43" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#126451" text-anchor="middle">G</text><line x1="0" y1="71" x2="1440" y2="71" stroke="#D9E3DF" stroke-width="1"/><text x="64" y="132" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172D29" text-anchor="start">Impor daftar siswa</text><text x="64" y="164" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526760" text-anchor="start">Gunakan template dari website, lalu periksa setiap baris sebelum menambahkan siswa.</text><rect x="64" y="190" width="1312" height="62" rx="12" fill="#FFFFFF" stroke="#D9E3DF"/><rect x="84" y="207" width="150" height="28" rx="14" fill="#E8F3ED"/><text x="159" y="226" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#126451" text-anchor="middle">1  Unduh template</text><text x="272" y="227" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#77847F" text-anchor="start">›</text><rect x="304" y="207" width="150" height="28" rx="14" fill="#E8F3ED"/><text x="379" y="226" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#126451" text-anchor="middle">2  Isi dan unggah</text><text x="492" y="227" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#77847F" text-anchor="start">›</text><rect x="524" y="207" width="170" height="28" rx="14" fill="#EDF2EF"/><text x="609" y="226" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#526760" text-anchor="middle">3  Periksa dan impor</text><rect x="64" y="272" width="1312" height="64" rx="10" fill="#FFFFFF" stroke="#D9E3DF"/><rect x="84" y="286" width="34" height="34" rx="10" fill="#126451"/><rect x="91.48" y="294.16" width="7.48" height="16.32" rx="2" fill="#FFFFFF"/><rect x="102.02" y="294.16" width="7.48" height="16.32" rx="2" fill="#FFFFFF"/><text x="132" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172D29" text-anchor="start">daftar-siswa.xlsx</text><text x="132" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526760" text-anchor="start">3 baris dibaca · Jenis kelamin L/P atau kosong · Tanggal kosong mengikuti awal semester</text><rect x="1188" y="282" width="166" height="42" rx="10" fill="#FFFFFF" stroke="#D9E3DF"/><text x="1271" y="309" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#126451" text-anchor="middle">Ganti file</text><rect x="64" y="354" width="1312" height="74" rx="10" fill="#E8F3ED" stroke="#D9E3DF"/><text x="86" y="381" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#126451" text-anchor="start">Periksa nama yang sama</text><text x="86" y="405" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">Untuk setiap baris, pilih tambah sebagai siswa berbeda atau lewati. Data lama tidak ditimpa.</text><rect x="64" y="448" width="1312" height="48" rx="8" fill="#EAF0ED"/><text x="122" y="478" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#526760" text-anchor="start">Baris</text><text x="176" y="478" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#526760" text-anchor="start">Nama</text><text x="388" y="478" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#526760" text-anchor="start">NIPD</text><text x="516" y="478" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#526760" text-anchor="start">Jenis kelamin</text><text x="646" y="478" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#526760" text-anchor="start">Masuk</text><text x="802" y="478" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#526760" text-anchor="start">Keluar</text><text x="952" y="478" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#526760" text-anchor="start">Pemeriksaan</text><rect x="64" y="496" width="1312" height="76" rx="0" fill="#FFFFFF" stroke="#D9E3DF"/><rect x="78" y="524" width="18" height="18" rx="4" fill="#126451" stroke="#126451"/><path d="M 82 533 L 85.5 537 L 92 529" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="527" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172D29" text-anchor="start">2</text><text x="178" y="527" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172D29" text-anchor="start">Kirana Putri</text><text x="390" y="527" font-
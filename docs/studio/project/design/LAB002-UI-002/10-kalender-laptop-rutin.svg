410" width="820" height="106" rx="10" fill="#FFF4D8" stroke="#E5D49D"/><text x="118" y="444" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#805C11" text-anchor="start">Batas perubahan jadwal</text><text x="118" y="472" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172D29" text-anchor="start">Perubahan rutin berlaku untuk tanggal mendatang atau tanggal tanpa catatan.</text><text x="118" y="495" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172D29" text-anchor="start">Tanggal yang sudah berabsensi ditinjau melalui pengecualian kalender.</text><rect x="696" y="568" width="104" height="42" rx="10" fill="#FFFFFF" stroke="#D9E3DF"/><text x="748" y="595" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#126451" text-anchor="middle">Batal</text><rect x="812" y="568" width="104" height="42" rx="10" fill="#126451"/><text x="864" y="595" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Simpan</text><rect x="976" y="190" width="400" height="462" rx="14" fill="#FFFFFF" stroke="#D9E3DF"/><text x="1008" y="235" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172D29" text-anchor="start">Aturan kalender</text><rect x="1008" y="258" width="126" height="28" rx="14" fill="#E8F3ED"/><text x="1071" y="277" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#126451" text-anchor="middle">Senin–Jumat</text><text x="1008" y="316" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172D29" text-anchor="start">Hari khusus diatur pada kalender</text><text x="1008" y="339" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">per tanggal, termasuk libur sekolah.</text><line x1="1008" y1="369" x2="1344" y2="369" stroke="#D9E3DF" stroke-width="1"/><text x="1008" y="406" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172D29" text-anchor="start">17 Oktober 2026</text><rect x="1008" y="420" width="94" height="28" rx="14" fill="#FFF4D8"/><text x="1055" y="439" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#805C11" text-anchor="middle">Hari libur</text><text x="1008" y="488" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">Jika tanggal libur kembali menjadi</text><text x="1008" y="510" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">hari sekolah, isi absensi baru.</text><text x="1008" y="532" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">Catatan lama tidak aktif kembali</text><text x="1008" y="554" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526760" text-anchor="start">secara otomatis.</text><text x="1008" y="614" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#126451" text-anchor="start">Kembali ke kalender</text></svg>